name: FIELD PWA Preview Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact Vercel Preview URL
        required: true
        type: string
      expected_sha:
        description: Exact 40-character Git commit SHA expected from /api/health
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.base_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Node supports native fetch
        run: node -e "const major=Number(process.versions.node.split('.')[0]); if(major<18){console.error('Node 18+ required'); process.exit(1)}"
      - name: Run read-only exact-preview PWA smoke
        run: node scripts/pwa-smoke.mjs
