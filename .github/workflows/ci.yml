name: FIELD POS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        run: npm test
      - name: Build Next.js application
        run: npm run build
      - name: Install browser QA runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run mobile and offline browser QA
        run: |
          set -euo pipefail
          npm start >/tmp/field-pos-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/field-pos-ci.log' EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/pos >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/pos >/dev/null
          python scripts/qa-pos-touch.py --base-url http://127.0.0.1:3000 --output /tmp/field-touch-qa
          python scripts/qa-offline-outbox.py --base-url http://127.0.0.1:3000 --output /tmp/field-outbox-qa
          python scripts/qa-cashier-flow.py --base-url http://127.0.0.1:3000 --output /tmp/field-cashier-flow-qa
          python scripts/qa-promptpay-nonblocking.py --base-url http://127.0.0.1:3000 --output /tmp/field-promptpay-qa
