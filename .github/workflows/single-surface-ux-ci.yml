name: FIELD Single Surface UX CI
on:
  push:
    branches:
      - ux/pos-single-surface-navigation-20261018
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/field-pos.log 2>&1 &
          echo $! > /tmp/field-pos.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/pos >/dev/null; then break; fi
            sleep 1
          done
          python scripts/qa-cashier-flow.py --base-url http://127.0.0.1:3000 --output /tmp/field-cashier-flow
