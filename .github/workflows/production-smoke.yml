name: FIELD Production Smoke

on:
  deployment_status:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: false
        default: https://field-pos.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || 'https://field-pos.vercel.app' }}
      EXPECTED_SHA: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
    steps:
      - name: Verify public health and core routes
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          echo "Checking $base"

          health="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 "$base/api/health")"
          echo "$health" > /tmp/health.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(health?.ok!==true) throw new Error('health_not_ok');
          if(health?.storage!=='turso') throw new Error('storage_not_turso');
          if(!health?.release || typeof health.release.commit!=='string') throw new Error('release_identity_missing');
          console.log('health ok',health.release);
          NODE

          for path in /pos /settings /close; do
            code="$(curl --silent --show-error --output /tmp/page.html --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 5 "$base$path")"
            test "$code" = "200" || { echo "::error::$path returned HTTP $code"; exit 1; }
            grep -q "FIELD POS" /tmp/page.html || { echo "::error::$path did not render FIELD POS shell"; exit 1; }
            echo "$path OK"
          done

      - name: Verify production commit matches expected main or deployment
        if: env.EXPECTED_SHA != ''
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          health="$(curl --fail --silent --show-error "$base/api/health")"
          actual="$(printf '%s' "$health" | node --input-type=module -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).release?.commit||''))")"
          if [ -z "$actual" ]; then
            echo "::error::Production health has no release commit"
            exit 1
          fi
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Stale release: expected SHA $EXPECTED_SHA but production reports $actual"
            exit 1
          fi
          echo "Production commit matches expected release: $actual"

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FIELD Production Smoke"
            echo "- URL: $BASE_URL"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Expected SHA: ${EXPECTED_SHA:-manual}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
