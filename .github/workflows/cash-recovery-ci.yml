name: FIELD Cash Recovery CI

on:
  push:
    branches:
      - fix/cash-recovery-ambiguous-errors

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
