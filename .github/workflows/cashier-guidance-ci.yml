name: FIELD Cashier Guidance CI
on:
  push:
    branches:
      - ux/cashier-next-action-coach
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install browser QA runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run cashier browser QA at 390x844
        env:
          PUBLIC_ORIGIN: https://field.test
        run: |
          npm start >/tmp/field-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/pos >/dev/null; then break; fi
            sleep 1
          done
          BROWSER="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          python scripts/qa-cashier-flow.py --base-url http://127.0.0.1:3000 --browser "$BROWSER" --output /tmp/field-cashier-flow-qa
          cat /tmp/field-cashier-flow-qa/results.json
